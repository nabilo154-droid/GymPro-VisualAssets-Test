name: Validate GymPro Visual Catalogue
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalogue and package integrity
        run: python scripts/validate_catalog.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
