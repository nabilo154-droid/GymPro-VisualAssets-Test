name: Build isolated Motion Generator preview
on:
  push:
    branches:
      - preview/qwen-08b-local
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: generator-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Validate catalogue and package integrity
        run: python3 scripts/validate_catalog.py
      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Assemble isolated preview
        run: |
          mkdir -p _preview/assets
          cp index.html generator.html catalog.json _preview/
          cp -R assets/. _preview/assets/
          cat > _preview/PREVIEW-README.txt <<'EOF'
          GymPro Motion Generator — isolated local preview

          This artifact is NOT published to GitHub Pages.
          1. Extract the artifact folder.
          2. Open PowerShell in the extracted folder.
          3. Run: py -m http.server 8000
          4. Open: http://localhost:8000/
          5. Click "Open Motion Generator".
          6. Keep Ollama running locally. Model default: qwen3.5:0.8b.

          If browser CORS blocks localhost Ollama requests, configure Ollama's
          OLLAMA_ORIGINS to include http://localhost:8000 and restart Ollama.
          No cloud API is used. Candidate JSON remains local and is not published.
          EOF
      - name: Upload preview artifact (no Pages deployment)
        uses: actions/upload-artifact@v4
        with:
          name: gympro-motion-generator-preview
          path: _preview/
          if-no-files-found: error
          retention-days: 14
