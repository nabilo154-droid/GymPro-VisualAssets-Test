name: Publish GymPro Visual Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate catalogue and package integrity
        run: python3 scripts/validate_catalog.py
      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp index.html catalog.json _site/
          cp assets/*.json _site/assets/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
